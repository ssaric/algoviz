# Compression.
#
# adapter-static runs with `precompress: true`, so the build already writes .br
# and .gz siblings, and the image enables brotli_static -- which is what
# actually serves traffic. Verified: the largest chunk goes out at exactly its
# 159543-byte .br size, brotli's maximum quality.
#
# So everything below is the fallback path, for the few files with no
# precompressed sibling. brotli_comp_level was 4, which is the one level worth
# avoiding: on 400 KB of real JavaScript, quality 4 yields 77.1 KB against
# plain gzip's 74.9 KB, so it costs CPU to produce a *worse* result than the
# gzip it displaces. 6 beats gzip while staying cheap enough to run live.
#
# gzip_static is deliberately not enabled: the precompressed .gz files are
# slightly larger than what nginx produces on the fly here (192962 against
# 191984 bytes), so switching it on would make gzip clients marginally worse
# off. Brotli covers every browser that matters; gzip is the long tail.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

brotli_comp_level 6;
brotli_min_length 256;
brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

# security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;


server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    # Static build with more than one route: prefer the prerendered page for
    # this path, then its directory index, then the root document.
    try_files $uri $uri/index.html /index.html =404;
  }

  location ~* \.(jpg|jpeg|png|gif|ico)$ {
    expires 30d;
    add_header Pragma public;
    add_header Cache-Control "public";
  }
  location ~* \.(css|js)$ {
    add_header Pragma public;
    add_header Cache-Control "public";
    expires 7d;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}

